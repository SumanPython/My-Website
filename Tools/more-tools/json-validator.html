<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JSON Validator — AllInOne Utilities</title>
<style>
:root {
    --bg-primary: #060a14;
    --bg-card: rgba(15, 24, 44, 0.78);
    --border-subtle: rgba(148, 163, 184, 0.16);
    --border-glow: rgba(96, 165, 250, 0.55);
    --text-main: #f1f5f9;
    --text-muted: #94a3b8;
    --accent-blue: #60a5fa;
    --green-bg: rgba(16, 185, 129, 0.14);
    --green-text: #34d399;
    --green-border: rgba(52, 211, 153, 0.35);
    --red-bg: rgba(239, 68, 68, 0.14);
    --red-text: #f87171;
    --red-border: rgba(248, 113, 113, 0.35);
}

* { box-sizing: border-box; }

body {
    margin: 0;
    background-color: var(--bg-primary);
    color: var(--text-main);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
}

/* Ambient Background & Twinkling Stars */
.background {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: -1;
    overflow: hidden;
    background:
        radial-gradient(circle at 50% -10%, rgba(59, 130, 246, 0.18), transparent 55%),
        radial-gradient(circle at 85% 35%, rgba(99, 102, 241, 0.08), transparent 45%),
        radial-gradient(circle at 15% 75%, rgba(14, 165, 233, 0.08), transparent 45%);
}

@keyframes twinkle {
    0%, 100% { opacity: 0.25; transform: scale(0.95); }
    50% { opacity: 0.9; transform: scale(1.15); }
}

.star {
    position: absolute;
    width: 3px;
    height: 3px;
    background: #ffffff;
    box-shadow: 0 0 8px rgba(191, 219, 254, 0.85);
    border-radius: 50%;
    animation: twinkle 4.5s ease-in-out infinite;
}

/* Sticky Glass Header */
.site-header {
    border-bottom: 1px solid var(--border-subtle);
    background: rgba(6, 10, 20, 0.82);
    backdrop-filter: blur(14px);
    position: sticky;
    top: 0;
    z-index: 100;
}

.header-inner {
    max-width: 1040px;
    margin: auto;
    padding: 18px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.brand {
    font-size: 26px;
    font-weight: 800;
    color: #fff;
    text-decoration: none;
    letter-spacing: -0.6px;
}
.brand span {
    background: linear-gradient(135deg, #60a5fa, #a5b4fc);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.back-link {
    color: #cbd5e1;
    text-decoration: none;
    font-size: 15px;
    font-weight: 500;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: color 0.2s;
}
.back-link:hover { color: var(--accent-blue); }

/* Main Workspace */
.container {
    max-width: 1040px;
    width: 100%;
    margin: 42px auto 60px;
    padding: 0 24px;
    flex: 1;
}

.tool-header {
    text-align: center;
    margin-bottom: 32px;
}
.tool-header h1 {
    font-size: 36px;
    font-weight: 800;
    margin: 0 0 10px;
    letter-spacing: -0.8px;
}
.tool-header p {
    color: var(--text-muted);
    font-size: 16px;
    margin: 0;
}

.workspace-card {
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    border-radius: 18px;
    padding: 24px;
    box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.06);
}

/* Toolbar */
.toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
}

.btn-group {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
}

button {
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    padding: 10px 16px;
    border-radius: 10px;
    border: 1px solid var(--border-subtle);
    background: rgba(30, 41, 59, 0.8);
    color: #e2e8f0;
    cursor: pointer;
    transition: all 0.18s ease;
}
button:hover {
    border-color: var(--border-glow);
    background: rgba(37, 52, 77, 0.95);
    color: #fff;
}

.btn-primary {
    background: linear-gradient(135deg, #2563eb, #3b82f6);
    border-color: rgba(96, 165, 250, 0.5);
    color: #fff;
    box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
}
.btn-primary:hover {
    background: linear-gradient(135deg, #1d4ed8, #2563eb);
    transform: translateY(-1px);
}

/* JSON Editor Textarea */
.editor-wrap {
    position: relative;
}

textarea {
    width: 100%;
    height: 360px;
    background: rgba(6, 11, 23, 0.9);
    border: 1px solid var(--border-subtle);
    border-radius: 12px;
    padding: 16px;
    color: #f8fafc;
    font-family: "JetBrains Mono", "Fira Code", Consolas, Monaco, monospace;
    font-size: 14px;
    line-height: 1.6;
    resize: vertical;
    outline: none;
    transition: border-color 0.2s;
}
textarea:focus {
    border-color: var(--accent-blue);
}
textarea::placeholder {
    color: #475569;
}

/* Validation Result Banner */
.result-box {
    margin-top: 18px;
    padding: 16px 20px;
    border-radius: 12px;
    font-size: 14.5px;
    line-height: 1.5;
    display: none;
}

.result-valid {
    display: block;
    background: var(--green-bg);
    border: 1px solid var(--green-border);
    color: var(--green-text);
}

.result-invalid {
    display: block;
    background: var(--red-bg);
    border: 1px solid var(--red-border);
    color: var(--red-text);
}

.result-title {
    font-weight: 700;
    font-size: 15.5px;
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    gap: 8px;
}

.result-meta {
    font-size: 13px;
    opacity: 0.9;
    font-family: "JetBrains Mono", Consolas, monospace;
}

.site-footer {
    border-top: 1px solid var(--border-subtle);
    text-align: center;
    padding: 24px 20px;
    color: #64748b;
    font-size: 14px;
}
</style>
</head>
<body>

<div class="background" id="background"></div>

<header class="site-header">
    <div class="header-inner">
        <a class="brand" href="../../index.html">AllIn<span>One</span></a>
        <a class="back-link" href="../../index.html#more-tools">← Back to Tools</a>
    </div>
</header>

<div class="container">
    <div class="tool-header">
        <h1>🔍 JSON Validator</h1>
        <p>Paste or upload JSON to verify syntax, spot errors instantly, and get smart fix suggestions.</p>
    </div>

    <div class="workspace-card">
        <div class="toolbar">
            <div class="btn-group">
                <button class="btn-primary" id="validateBtn">✓ Validate JSON</button>
                <button id="uploadBtn">📁 Load .json File</button>
                <input type="file" id="fileInput" accept=".json,application/json,text/plain" hidden>
            </div>
            <div class="btn-group">
                <button id="sampleValidBtn">Sample Valid</button>
                <button id="sampleErrorBtn">Sample Broken</button>
                <button id="clearBtn">Clear</button>
            </div>
        </div>

        <div class="editor-wrap">
            <textarea id="jsonInput" spellcheck="false" placeholder='Paste your JSON here... e.g. {"service": "allinone", "active": true}'></textarea>
        </div>

        <div id="resultBox" class="result-box"></div>
    </div>
</div>

<footer class="site-footer">
    AllInOne Utilities — Fast, private browser-based tools.
</footer>

<script>
    // Twinkling stars
    const background = document.getElementById("background");
    for (let i = 0; i < 80; i++) {
        const star = document.createElement("div");
        star.className = "star";
        star.style.left = Math.random() * 100 + "%";
        star.style.top = Math.random() * 100 + "%";
        star.style.animationDelay = (Math.random() * 4.5) + "s";
        background.appendChild(star);
    }

    const jsonInput = document.getElementById("jsonInput");
    const resultBox = document.getElementById("resultBox");
    const validateBtn = document.getElementById("validateBtn");
    const uploadBtn = document.getElementById("uploadBtn");
    const fileInput = document.getElementById("fileInput");
    const sampleValidBtn = document.getElementById("sampleValidBtn");
    const sampleErrorBtn = document.getElementById("sampleErrorBtn");
    const clearBtn = document.getElementById("clearBtn");

    function getLineAndColumn(text, position) {
        const lines = text.slice(0, position).split("\n");
        return {
            line: lines.length,
            column: lines[lines.length - 1].length + 1
        };
    }

    // Smart suggestion generator for common JSON mistakes
    function getSmartSuggestion(errorMessage, rawText, position) {
        const msg = errorMessage.toLowerCase();

        if (msg.includes("trailing comma")) {
            return "💡 **Fix Suggestion:** You have an extra comma at the end of your list or object. Remove the last comma before the closing bracket `}` or `]`.";
        }
        if (msg.includes("unexpected token") || msg.includes("expected")) {
            let snippet = "";
            if (position !== null && position !== undefined && position < rawText.length) {
                const start = Math.max(0, position - 15);
                const end = Math.min(rawText.length, position + 15);
                snippet = ` Near: \`...${rawText.slice(start, end).replace(/\n/g, " ")}...\``;
            }

            if (rawText.includes("'")) {
                return `💡 **Fix Suggestion:** JSON requires double quotes (\`"\`) for keys and strings. It looks like you might be using single quotes (\`'\').${snippet}`;
            }
            return `💡 **Fix Suggestion:** Check for a missing comma between items, a missing colon (\`:\`), or unquoted key names.${snippet}`;
        }
        if (msg.includes("unexpected end of json input")) {
            return "💡 **Fix Suggestion:** Your JSON seems cut off. Check if you forgot a closing bracket `}` or `]`.";
        }
        
        return "💡 **Fix Suggestion:** Check for unmatched brackets, missing quotation marks around keys, or trailing commas.";
    }

    function validateJSON() {
        const raw = jsonInput.value.trim();

        if (!raw) {
            resultBox.className = "result-box result-invalid";
            resultBox.innerHTML = `<div class="result-title">⚠️ Empty Input</div><div>Please paste or load some JSON data before validating.</div>`;
            return;
        }

        try {
            const parsed = JSON.parse(raw);
            const rootType = Array.isArray(parsed)
                ? `Array (${parsed.length} items)`
                : (parsed !== null && typeof parsed === "object")
                    ? `Object (${Object.keys(parsed).length} top-level keys)`
                    : `Primitive (${typeof parsed})`;

            resultBox.className = "result-box result-valid";
            resultBox.innerHTML = `
                <div class="result-title">✅ Valid JSON</div>
                <div class="result-meta">Root Type: ${rootType} • Size: ${new Blob([raw]).size} bytes</div>
            `;
        } catch (err) {
            let locationInfo = "";
            let pos = null;
            const posMatch = err.message.match(/position\s+(\d+)/i);
            
            if (posMatch) {
                pos = parseInt(posMatch[1], 10);
                const loc = getLineAndColumn(raw, pos);
                locationInfo = ` (Line ${loc.line}, Column ${loc.column})`;
            }

            const suggestion = getSmartSuggestion(err.message, raw, pos);

            resultBox.className = "result-box result-invalid";
            resultBox.innerHTML = `
                <div class="result-title">❌ Invalid JSON${locationInfo}</div>
                <div class="result-meta" style="margin-bottom: 8px;">${err.message}</div>
                <div style="font-size: 13.5px; border-top: 1px solid rgba(248, 113, 113, 0.25); padding-top: 8px; margin-top: 6px;">${suggestion}</div>
            `;
        }
    }

    validateBtn.addEventListener("click", validateJSON);

    // Load local .json file
    uploadBtn.addEventListener("click", () => fileInput.click());
    fileInput.addEventListener("change", (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
            jsonInput.value = event.target.result;
            validateJSON();
        };
        reader.readAsText(file);
        fileInput.value = "";
    });

    // Sample buttons
    sampleValidBtn.addEventListener("click", () => {
        jsonInput.value = JSON.stringify({
            platform: "AllInOne Utilities",
            version: 1.0,
            categories: ["Audio Converter", "Image Tools", "PDF Tools", "Video Converter", "More Tools"],
            clientSideOnly: true
        }, null, 2);
        validateJSON();
    });

    sampleErrorBtn.addEventListener("click", () => {
        // Sample with a missing comma error
        jsonInput.value = `{\n  "platform": "AllInOne Utilities",\n  "missingComma": true\n  "status": "broken"\n}`;
        validateJSON();
    });

    clearBtn.addEventListener("click", () => {
        jsonInput.value = "";
        resultBox.className = "result-box";
        resultBox.innerHTML = "";
    });
</script>

</body>
</html>
