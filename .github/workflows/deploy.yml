name: CI Docker Build Check

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-docker:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: false # Set to false since we aren't pushing to a registry yet
        tags: allinone-app:latest
        load: true # Loads the built image into the runner's local docker daemon

    - name: Test Running Container
      run: |
        echo "Running container health check..."
        docker run -d -p 3000:3000 --name test-app allinone-app:latest
        sleep 3
        docker ps
        docker logs test-app